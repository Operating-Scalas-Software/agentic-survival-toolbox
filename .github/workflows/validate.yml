name: Validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release tags are needed by the backfill check below, which reads the
          # tags this repository has already published.
          fetch-depth: 0

      - name: Public-safety scan
        run: bash scripts/check-public-safety.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install APM (pinned)
        # Version-pinned only: `--require-hashes` would require pinning the full
        # transitive wheel closure (~60 wheels, many platform-specific), so the
        # version pin is the supply-chain control for this dependency.
        run: pip install apm-cli==0.35.0

      - name: Install script dependencies
        # Pinned explicitly rather than inherited from apm-cli's requirements;
        # matches the pin in publish.yml.
        run: pip install pyyaml==6.0.3

      - name: Marketplace check
        run: apm marketplace check

      - name: Release gates
        run: apm pack --check-versions --check-clean --dry-run

      - name: Release tag plan
        # Offline derivation check for the two tag families (ADR-0002). The
        # published set itself is verified by the `--check` mode in publish.yml.
        run: python3 scripts/release_tags.py --plan

      - name: Backfill debt
        # Non-blocking: releases published before the alias tags existed cannot
        # resolve an exact pin until they are backfilled, so make that debt
        # visible here instead of relying on memory.
        run: |
          set -euo pipefail
          missing="$(python3 scripts/release_tags.py --backfill)"
          if [ "${missing}" = "no missing alias tags" ]; then
            echo "no backfill debt"
            exit 0
          fi
          while IFS= read -r line; do
            echo "::warning title=Backfill debt::${line}"
          done <<< "${missing}"

      - name: Skill audit
        # Matches CONTRIBUTING.md: audit every package's skills, not just one.
        # `mapfile` plus the count guard keeps a silent zero-match - or a failing
        # `find`, whose status process substitution discards - from passing.
        run: |
          set -euo pipefail
          mapfile -t files < <(find plugins -path '*/.apm/skills/*/SKILL.md' -print | sort)
          (( ${#files[@]} > 0 )) || { echo "no skills found to audit" >&2; exit 1; }
          for f in "${files[@]}"; do
            echo "auditing ${f}"
            apm audit --file "${f}"
          done

      - name: No separate release workflow
        # ADR-0001: publish.yml owns the tag and the release, so a second owner
        # is the regression this guards against.
        run: test ! -e .github/workflows/release.yml

  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run tests (Python/Node)
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          py=(tests/**/test_*.py tests/**/*_test.py)
          js=(tests/**/*.test.mjs tests/**/*.test.js)
          if (( ${#py[@]} > 0 )); then
            # pyyaml: imported by the skill scripts the tests load; keep in step
            # with the `dependencies` blocks in those scripts (PEP 723).
            pip install pytest==9.2.0 pyyaml==6.0.3
            pytest -q tests
          fi
          if (( ${#js[@]} > 0 )); then
            node --test tests/
          fi
          if (( ${#py[@]} == 0 && ${#js[@]} == 0 )); then
            echo "No tests found; skipping."
          fi

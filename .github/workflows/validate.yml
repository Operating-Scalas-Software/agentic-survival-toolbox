name: Validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Public-safety scan
        run: bash scripts/check-public-safety.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install APM (pinned)
        # Version-pinned only: `--require-hashes` would require pinning the full
        # transitive wheel closure (~60 wheels, many platform-specific), so the
        # version pin is the supply-chain control for this dependency.
        run: pip install apm-cli==0.35.0

      - name: Marketplace check
        run: apm marketplace check

      - name: Release gates
        run: apm pack --check-versions --check-clean --dry-run

      - name: Skill audit
        run: |
          for f in plugins/sdlc/.apm/skills/*/SKILL.md; do
            echo "auditing ${f}"
            apm audit --file "${f}"
          done

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Run tests (Python/Node)
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          py=(tests/**/test_*.py tests/**/*_test.py)
          js=(tests/**/*.test.mjs tests/**/*.test.js)
          if (( ${#py[@]} > 0 )); then
            pip install pytest==9.2.0
            pytest -q tests
          fi
          if (( ${#js[@]} > 0 )); then
            node --test tests/
          fi
          if (( ${#py[@]} == 0 && ${#js[@]} == 0 )); then
            echo "No tests found; skipping."
          fi

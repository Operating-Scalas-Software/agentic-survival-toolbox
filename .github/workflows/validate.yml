name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Public-safety scan
        run: bash scripts/check-public-safety.sh

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install APM (pinned)
        run: pip install apm-cli==0.35.0

      - name: Marketplace check
        run: apm marketplace check

      - name: Release gates
        run: apm pack --check-versions --check-clean --dry-run

      - name: Skill audit
        run: |
          for f in plugins/sdlc/.apm/skills/*/SKILL.md; do
            echo "auditing ${f}"
            apm audit --file "${f}"
          done

name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: bash scripts/check-public-safety.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install APM (pinned)
        run: pip install apm-cli==0.35.0

      - name: Marketplace check
        run: apm marketplace check

      - name: Release gates
        run: apm pack --check-versions --check-clean --dry-run

      - name: Build marketplace output
        run: apm pack --check-versions --strict-metadata

      - name: Publish marketplace branch
        env:
          BRANCH: marketplace
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "noreply@localhost"

          snapshot="$(mktemp -d)"
          worktree="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$worktree" 2>/dev/null || true
            rm -rf "$snapshot"
          }
          trap cleanup EXIT

          rsync -a --delete --exclude '.git' ./ "$snapshot/"

          git fetch origin "$BRANCH" || true
          if git rev-parse "origin/$BRANCH" >/dev/null 2>&1; then
            base="$(git rev-parse "origin/$BRANCH")"
            git worktree add --force --detach "$worktree" "origin/$BRANCH"
          else
            base=""
            git worktree add --force --detach "$worktree" HEAD
          fi

          rsync -a --delete --exclude '.git' "$snapshot/" "$worktree/"
          (cd "$worktree" && git add -A)
          if (cd "$worktree" && git diff --cached --quiet) && [ -n "$base" ]; then
            echo "No changes to publish; skipping."
            exit 0
          fi
          (cd "$worktree" && git commit -m "chore: publish from main" --allow-empty)
          head="$(cd "$worktree" && git rev-parse HEAD)"

          if [ -n "$base" ]; then
            git fetch origin "$BRANCH"
            now="$(git rev-parse "origin/$BRANCH")"
            if [ "$now" != "$base" ]; then
              echo "marketplace branch moved concurrently (expected $base, got $now); rerun."
              exit 1
            fi
          fi

          git push origin "$head:refs/heads/$BRANCH"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          # Lockstep versioning: the root apm.yml `version` is the release
          # anchor; `apm pack --check-versions` enforces every package matches it.
          version="$(sed -n 's/^version:[[:space:]]*//p' apm.yml | head -n1)"
          tag="v${version}"
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; skipping."
          else
            git tag "${tag}"
            git push origin "${tag}"
            # Pushes made with GITHUB_TOKEN do not trigger other workflows, so
            # release.yml will not run; create the notes-only release here.
            gh release create "${tag}" \
              --repo "${{ github.repository }}" \
              --title "${tag}" \
              --generate-notes
          fi

name: agentic-survival-toolbox
version: 0.2.0
description: A public marketplace of reusable agent skills, agents, and Copilot plugins.
author: agentic-survival-toolbox
license: Apache-2.0
marketplace:
  owner:
    name: agentic-survival-toolbox
  outputs:
    claude: {}
    copilot: {}
  build:
    tagPattern: "v{version}"
  packages:
    - name: aws
      source: ./plugins/aws
      version: 0.2.0
    - name: sdlc
      source: ./plugins/sdlc
      version: 0.2.0
